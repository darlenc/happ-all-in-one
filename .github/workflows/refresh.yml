name: Refresh Happ VPN pool

on:
  workflow_dispatch:
  push:
    paths:
      - "build.py"
      - "probe.py"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: happ-pool-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official sing-box client
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --connect-timeout 15 \
            "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz" \
            -o /tmp/singbox.tar.gz
          tar -xzf /tmp/singbox.tar.gz
          cp "sing-box-1.14.4-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          ./sing-box version
      - name: Validate Python sources
        run: python -m py_compile build.py probe.py
      - name: Fetch and filter candidates (not counted as working)
        run: python build.py --limit 240 --out candidates.txt
      - name: Probe real HTTPS traffic via each candidate VPN
        run: python probe.py --input candidates.txt --output happ-all.txt --binary ./sing-box --workers 12 --timeout 7 --limit 100
      - name: Publish verified subscription and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add happ-all.txt status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh HTTPS-tested Happ nodes [skip ci]"
            git push
          fi
